name: Python tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # CPU wheels: no GPU/ROCm runtime needed and a far smaller download.
      - run: python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      # Tests use synthetic tensors only: no MNIST download, no pretrained weights.
      - run: python -m unittest discover -s tests -t . -v
